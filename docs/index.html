<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>출퇴근</title>
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
</head>
<body>
<header>
  <div>
    <h1 id="title">출퇴근</h1>
    <div class="sub" id="who">로그인 필요</div>
  </div>
  <button class="icon-btn" id="btnLogout" title="로그아웃" hidden>⎋</button>
</header>

<!-- 가입 / 로그인 -->
<section id="authView">
  <div class="card">
    <h2 id="authTitle">회원가입</h2>
    <div id="signupFields">
      <label>이름</label>
      <input id="fName" placeholder="홍길동" autocomplete="name">
    </div>
    <label>휴대폰 번호</label>
    <input id="fPhone" inputmode="tel" placeholder="010-0000-0000" autocomplete="tel">
    <label>PIN (숫자 4~6자리)</label>
    <input id="fPin" inputmode="numeric" type="password" maxlength="6" placeholder="••••">
    <div id="storeField">
      <label>근무 매장</label>
      <select id="fStore"><option value="">매장 불러오는 중…</option></select>
    </div>
    <div class="error" id="authError"></div>
    <button class="btn primary" id="btnAuth">가입하고 시작하기</button>
    <button class="link" id="toggleAuth">이미 가입했어요 → 로그인</button>
    <div class="note">가입 시 선택한 매장의 위치가 자동으로 적용됩니다. 별도 설정은 없습니다.</div>
  </div>
</section>

<!-- 출퇴근 -->
<section id="mainView" hidden>
  <div class="card">
    <div class="status">
      <div class="dot wait" id="dot"></div>
      <div>
        <div class="t" id="stTitle">위치 확인 중…</div>
        <div class="d" id="stDesc">GPS 권한을 허용해 주세요</div>
      </div>
    </div>
    <div class="metrics">
      <div class="metric"><div class="k">매장까지</div><div class="v" id="mDist">–</div></div>
      <div class="metric"><div class="k">허용 반경</div><div class="v" id="mRadius">–</div></div>
      <div class="metric"><div class="k">GPS 오차</div><div class="v" id="mAcc">–</div></div>
    </div>
  </div>

  <div class="card">
    <div class="clock">
      <div class="time" id="clockTime">--:--:--</div>
      <div class="date" id="clockDate"></div>
    </div>
    <div class="actions">
      <button class="big in" id="btnIn" disabled>출근<span id="btnInSub">확인 중</span></button>
      <button class="big out" id="btnOut" disabled>퇴근<span id="btnOutSub">확인 중</span></button>
    </div>
    <div class="hint" id="hint"></div>
  </div>

  <div class="card">
    <h2>최근 기록</h2>
    <ul class="log" id="log"></ul>
    <div class="empty" id="logEmpty">아직 기록이 없습니다.</div>
  </div>
</section>
<div class="toast" id="toast"></div>

<script>
(() => {
  const C = window.APP_CONFIG, API = C.API_BASE.replace(/\/$/, '');
  const $ = id => document.getElementById(id);
  const K = { auth: 'att.auth', queue: 'att.queue', log: 'att.log' };
  const MAX_ACC = 100;
  const load = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
  const toast = m => { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2400); };
  const fmt2 = n => String(n).padStart(2, '0');
  const fmtTime = d => `${fmt2(d.getHours())}:${fmt2(d.getMinutes())}:${fmt2(d.getSeconds())}`;
  const fmtDate = d => `${d.getFullYear()}.${fmt2(d.getMonth() + 1)}.${fmt2(d.getDate())} (${'일월화수목금토'[d.getDay()]})`;
  const isoLocal = d => { const o = -d.getTimezoneOffset(), s = o >= 0 ? '+' : '-'; return `${d.getFullYear()}-${fmt2(d.getMonth() + 1)}-${fmt2(d.getDate())}T${fmtTime(d)}${s}${fmt2(Math.floor(Math.abs(o) / 60))}:${fmt2(Math.abs(o) % 60)}`; };
  const distM = (a, b, c, d) => { const R = 6371000, r = x => x * Math.PI / 180; const h = Math.sin(r(c - a) / 2) ** 2 + Math.cos(r(a)) * Math.cos(r(c)) * Math.sin(r(d - b) / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); };

  let auth = load(K.auth, null);   // {token, name}
  let store = null, pos = null, watchId = null, mode = 'signup';
  let log = load(K.log, []);       // 최근 기록 캐시(표시용)
  let queue = load(K.queue, []);   // 미전송 기록

  async function api(path, opt = {}) {
    const headers = { 'content-type': 'application/json', ...(opt.headers || {}) };
    if (auth && auth.token) headers.authorization = 'Bearer ' + auth.token;
    const res = await fetch(API + path, { ...opt, headers, body: opt.body ? JSON.stringify(opt.body) : undefined });
    const j = await res.json().catch(() => ({ ok: false, error: 'HTTP ' + res.status }));
    if (res.status === 401 && auth && path !== '/auth/login' && path !== '/auth/signup') { logout('세션이 만료되었습니다. 다시 로그인하세요'); }
    return { status: res.status, ...j };
  }

  // ---------- 인증 화면
  async function loadStores() {
    const sel = $('fStore');
    try {
      const r = await api('/stores');
      sel.innerHTML = '<option value="">근무 매장 선택</option>' + (r.stores || []).map(s => `<option value="${s.id}">${s.name}${s.address ? ' · ' + s.address : ''}</option>`).join('');
    } catch { sel.innerHTML = '<option value="">매장 목록을 불러오지 못했습니다</option>'; }
  }
  function setMode(m) {
    mode = m;
    $('authTitle').textContent = m === 'signup' ? '회원가입' : '로그인';
    $('signupFields').hidden = m !== 'signup';
    $('storeField').hidden = m !== 'signup';
    $('btnAuth').textContent = m === 'signup' ? '가입하고 시작하기' : '로그인';
    $('toggleAuth').textContent = m === 'signup' ? '이미 가입했어요 → 로그인' : '처음이에요 → 회원가입';
    $('authError').textContent = '';
  }
  $('toggleAuth').onclick = () => setMode(mode === 'signup' ? 'login' : 'signup');
  $('btnAuth').onclick = async () => {
    const body = { phone: $('fPhone').value, pin: $('fPin').value };
    if (mode === 'signup') { body.name = $('fName').value; body.store_id = $('fStore').value; }
    $('btnAuth').disabled = true; $('authError').textContent = '';
    try {
      const r = await api(mode === 'signup' ? '/auth/signup' : '/auth/login', { method: 'POST', body });
      if (!r.ok) { $('authError').textContent = r.error || '실패'; return; }
      auth = { token: r.token, name: r.name }; save(K.auth, auth);
      log = []; save(K.log, log);
      await enterMain();
    } catch { $('authError').textContent = '서버에 연결할 수 없습니다'; }
    finally { $('btnAuth').disabled = false; }
  };
  function logout(msg) {
    auth = null; store = null; localStorage.removeItem(K.auth);
    if (watchId != null) navigator.geolocation.clearWatch(watchId);
    $('mainView').hidden = true; $('authView').hidden = false; $('btnLogout').hidden = true;
    $('who').textContent = '로그인 필요'; setMode('login'); loadStores();
    if (msg) toast(msg);
  }
  $('btnLogout').onclick = () => { if (confirm('로그아웃할까요?')) logout(); };

  // ---------- 메인
  async function enterMain() {
    const r = await api('/me/store');
    if (!r.ok) { if (r.status !== 401) toast(r.error || '매장 정보를 불러오지 못했습니다'); return; }
    store = r.store;
    $('authView').hidden = true; $('mainView').hidden = false; $('btnLogout').hidden = false;
    $('who').textContent = `${auth.name} · ${store.name}`;
    $('mRadius').innerHTML = `${store.radius_m}<small>m</small>`;
    render(); startGeo(); refreshLog(); flushQueue();
  }
  function setStatus(cls, t, d) { $('dot').className = 'dot ' + cls; $('stTitle').textContent = t; $('stDesc').textContent = d; }
  function evaluate() {
    let ok = false, reason = '';
    if (!pos) { setStatus('wait', '위치 확인 중…', 'GPS 신호를 기다리는 중'); reason = '위치 확인 중'; }
    else {
      const d = distM(pos.lat, pos.lng, store.lat, store.lng);
      $('mDist').innerHTML = d < 1000 ? `${Math.round(d)}<small>m</small>` : `${(d / 1000).toFixed(1)}<small>km</small>`;
      $('mAcc').innerHTML = `±${Math.round(pos.acc)}<small>m</small>`;
      if (pos.acc > MAX_ACC) { setStatus('wait', 'GPS 정확도 낮음', `오차 ±${Math.round(pos.acc)}m · 실외/창가로 이동하세요`); reason = 'GPS 정확도 낮음'; }
      else if (d - pos.acc <= store.radius_m) { setStatus('in', '매장 반경 안', `${store.name}까지 ${Math.round(d)}m`); ok = true; }
      else { setStatus('out', '매장 반경 밖', `${store.name}까지 ${Math.round(d)}m · 반경 ${store.radius_m}m`); reason = '반경 밖'; }
    }
    $('btnIn').disabled = !ok; $('btnOut').disabled = !ok;
    $('btnInSub').textContent = ok ? '지금 기록' : reason; $('btnOutSub').textContent = ok ? '지금 기록' : reason;
    const today = new Date().toDateString();
    const last = log.find(r => new Date(r.ts).toDateString() === today);
    $('hint').textContent = last ? `오늘 마지막 기록: ${last.type === 'IN' ? '출근' : '퇴근'} ${fmtTime(new Date(last.ts))}` : '오늘 기록 없음';
    return ok;
  }
  function startGeo() {
    if (!navigator.geolocation) { setStatus('out', 'GPS 미지원', '이 브라우저는 위치를 지원하지 않습니다'); return; }
    if (watchId != null) navigator.geolocation.clearWatch(watchId);
    watchId = navigator.geolocation.watchPosition(p => { pos = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }; evaluate(); },
      e => { const m = { 1: '위치 권한이 거부됨 · 브라우저 설정에서 허용', 2: '위치를 가져올 수 없음', 3: '위치 요청 시간 초과' }[e.code] || '위치 오류'; setStatus('out', '위치 확인 실패', m); pos = null; evaluate(); },
      { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 });
  }
  setInterval(() => { const d = new Date(); $('clockTime').textContent = fmtTime(d); $('clockDate').textContent = fmtDate(d); }, 250);

  // ---------- 기록
  async function record(type) {
    if (!pos || !store) return;
    const d = new Date();
    const inRange = evaluate();
    const entry = {
      client_record_id: d.getTime() + '-' + Math.random().toString(36).slice(2, 8),
      type, recorded_at: isoLocal(d), lat: +pos.lat.toFixed(6), lng: +pos.lng.toFixed(6), accuracy_m: Math.round(pos.acc),
      client_in_range: inRange, device_info: navigator.userAgent.slice(0, 100),
    };
    log.unshift({ ts: d.getTime(), type, synced: false, flagged: false }); log = log.slice(0, 30); save(K.log, log);
    queue.push(entry); save(K.queue, queue);
    if (navigator.vibrate) navigator.vibrate(30);
    toast(`${type === 'IN' ? '출근' : '퇴근'} ${fmtTime(d)} 기록됨`);
    render(); await flushQueue();
  }
  async function flushQueue() {
    if (!queue.length || !auth) return;
    const remain = [];
    for (const e of queue) {
      try {
        const r = await api('/attendance', { method: 'POST', body: e });
        if (r.ok) { const l = log.find(x => x.ts === parseInt(e.client_record_id, 10)); if (l) { l.synced = true; l.flagged = r.flagged; } }
        else if (r.status >= 500 || r.status === 0) remain.push(e);
        else toast(r.error || '기록 거부됨');
      } catch { remain.push(e); }
    }
    queue = remain; save(K.queue, queue); save(K.log, log); render();
    if (remain.length) toast(`미전송 ${remain.length}건 · 자동 재시도`);
  }
  async function refreshLog() {
    const r = await api('/attendance');
    if (!r.ok) return;
    const server = r.records.map(x => ({ ts: new Date(x.recorded_at).getTime(), type: x.type, synced: true, flagged: !!x.flagged }));
    const pending = log.filter(x => !x.synced);
    log = [...pending, ...server].sort((a, b) => b.ts - a.ts).slice(0, 30); save(K.log, log); render();
  }
  function render() {
    const ul = $('log'); ul.innerHTML = '';
    $('logEmpty').style.display = log.length ? 'none' : 'block';
    for (const r of log.slice(0, 15)) {
      const li = document.createElement('li'), d = new Date(r.ts);
      li.innerHTML = `<span class="tag ${r.type === 'IN' ? 'in' : 'out'}">${r.type === 'IN' ? '출근' : '퇴근'}</span>
        <span class="when">${fmtDate(d).slice(5)} ${fmtTime(d)}</span>
        ${r.flagged ? '<span class="tag flag">확인 필요</span>' : ''}
        <span class="sync ${r.synced ? '' : 'err'}">${r.synced ? '서버 ✓' : '미전송'}</span>`;
      ul.appendChild(li);
    }
    if (store) evaluate();
  }
  $('btnIn').onclick = () => record('IN');
  $('btnOut').onclick = () => record('OUT');
  document.addEventListener('visibilitychange', () => { if (!document.hidden && store) { startGeo(); flushQueue(); } });
  window.addEventListener('online', flushQueue);

  // ---------- 시작
  $('title').textContent = (C.COMPANY_NAME ? C.COMPANY_NAME + ' ' : '') + '출퇴근';
  if (auth) { enterMain().catch(() => toast('서버에 연결할 수 없습니다')); } else { setMode('signup'); loadStores(); }
})();
</script>
</body>
</html>
